<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>Student Registarting</h1>
    <form action="requst.php" method="get" >
       
        <label for="name">name</label>
        <input type="text" name="stu_name" id="name">
        <br><br>

        <label for="email">email</label>
        <input type="email" name="stu_email" id="email">
        <br><br>

        <label for="password">password</label>
        <input type="password" name="stu_password" id="password">
        <br><br>

        <label for="phone">phone</label>
        <input type="number" name="stu_ph" id="phone">
        <br><br>

        <label for="dob">date of birth</label>
        <input type="date" name="stu_date" id="date">
        <br><br>

        <label for="passport">passport</label>
        <input type="file" accept=".pdf" id="stu_passport">
        <br><br>

        <label for="year">year</label>
        <select name="stu_year" id="year">
            <option value="">choose your year</option>
            <option value="1">first year</option>
            <option value="2">second year</option>
            <option value="2">third year</option>
            
        </select>
        <br><br>

        <label for="">gender</label>
        <br><br>

        <input type="radio" name="gender" id="male" value="male"><label for="male">male</label>
        <input type="radio" name="gender" id="female" value="female"><label for="female">female</label>
        <input type="radio" name="gender" id="other" value="other"><label for="other">other</label>
        <br><br>

        <label for="">Hobby</label>
        <br><br>
        <input type="checkbox" name="gamming" id="gamming"><label for="gamming">gamming</label>
        <input type="checkbox" name="reading" id="reading"><label for="reading">reading</label>
        <br><br>

        <label for="address">Address</label>
        <textarea name="stu_address" id="address" cols="50" rows="30"></textarea>
        <br><br>
        <input type="time" name="" id="">
        <br><br>
        <input type="range" min="0" max="100" name="" id="">
        <br><br>
        <input type="text" name="" id="" required>
        <br><br>
        <input type="text" name="city1" id="" value="mandalay">
        <br><br>
        <input type="text" name="city2" id="" value="Yangon" readonly>
        <br><br>
        <input type="text" name="pla" id="" placeholder="eg.09984067721">
        <br><br>
        <button type="submit">submit</button>
    </form>
</body>
</html>
