<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- bootstrap  -->
     <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body>

    <h1 class="text-center my-5 text-danger">Form Lessons</h1>

    <div class="container">
        <div class="row">
            <div class="offset-lg-4 col-lg-4">
                <form action="" method="post">
                    <div class="mb-3">
                        <label for="photo" class="form-lable">Photo</label>
                        <input type="file" name="photo" id="photo" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-lable">Name</label>
                        <input type="text" name="name" id="name" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-lable">Email</label>
                        <input type="email" name="email" id="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-lable">Phone</label>
                        <input type="number" name="phone" id="phone" class="form-control">
                    </div>

                    <label class="form-lable">Gender</label>
                    <div class="form-check">
                        <input type="radio" name="gender" id="gender" class="form-check-input ">
                        <label for="male" class="form-lable">Male</label>
                        
                    </div>
                    <div class="form-check">
                        <input type="radio" name="gender" id="gender" class="form-check-input">
                        <label for="female" class="form-lable">female</label>
                        
                    </div>
                    <label class="form-lable d-block mt-3">Choose Education</label>
                    <select class="form-select mb-3">
                        <option value="0">1</option>
                        <option value="1">2</option>
                        <option value="2">3</option>
                    </select>
                </form>
            </div>
        </div>
    </div>
    

    <!-- js  -->
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
