<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="CSS/CSS.css">
</head>

<body class="bg-light d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">

                <!-- Logo & Brand Header -->
                <div class="text-center mb-4">
                    
                    <a href="index.html" class="text-decoration-none text-dark d-inline-flex align-items-center gap-2">
                        <img src="Image/logo 1.png" alt="Logo" class="logo" />
                    </a>
                    <p class="text-muted small mt-1">မင်းရဲ့ Account သို့ ဝင်ရောက်ပါ သို့မဟုတ် အကောင့်သစ်ပြုလုပ်ပါ</p>
                </div>

                <!-- Main Form Card -->
                <div class="card border-0 rounded-4 shadow-sm p-4 p-md-5 bg-white">

                    <!-- Tab Toggle Header (Login vs Register) -->
                    <ul class="nav nav-pills nav-justified mb-4 bg-light rounded-pill p-1" id="authTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active rounded-pill fw-bold" id="login-tab" data-bs-toggle="tab"
                                data-bs-target="#login-pane" type="button" role="tab">
                                Sign In
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link rounded-pill fw-bold" id="register-tab" data-bs-toggle="tab"
                                data-bs-target="#register-pane" type="button" role="tab">
                                Register
                            </button>
                        </li>
                    </ul>

                    <!-- Tab Contents Area -->
                    <div class="tab-content" id="authTabContent">

                        <!-- SIGN IN FORM -->
                        <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Email</label>
                                    <div class="input-group">
                                        <input type="email" class="form-control rounded-end-3 border-start-0"
                                            placeholder="example@gmail.com" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <label class="form-label fw-semibold">Password</label>

                                    </div>
                                    <div class="input-group">
                                        <input type="password" class="form-control rounded-end-3 border-start-0"
                                            placeholder="••••••••" required>
                                    </div>
                                </div>



                                <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-bold fs-6 mb-3">
                                    Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
                                </button>
                            </form>
                        </div>

                        <!-- 2. REGISTER FORM -->
                        <div class="tab-pane fade" id="register-pane" role="tabpanel">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Name</label>
                                    <input type="text" class="form-control rounded-3" placeholder="Mg Mg" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Ph no.</label>
                                    <input type="tel" class="form-control rounded-3" placeholder="09xxxxxxxxx" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Email</label>
                                    <input type="email" class="form-control rounded-3" placeholder="example@gmail.com"
                                        required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Password</label>
                                    <input type="password" class="form-control rounded-3" placeholder="••••••••"
                                        required>
                                </div>

                                <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-bold fs-6 mb-3">
                                    Create Account <i class="fa-solid fa-user-plus ms-2"></i>
                                </button>
                            </form>
                        </div>

                    </div>

                    
                    

                </div>
            </div>
        </div>
    </div>

    <!-- Jquery -->
    <script src="JS/jquery-4.0.0.min.js"></script>


    <script src="https://code.jquery.com/jquery-2.2.0.min.js" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.6.0/slick.js"></script>

    <!-- custom js -->
    <script src="JS/Javascript.js"></script>

    <!-- Bootstrap -->
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- icon -->
    <script src="fontawesome/js/all.min.js"></script>
</body>

</html>
