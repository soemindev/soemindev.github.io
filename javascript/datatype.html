<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Data type</h1>

    <script>

        // String data type 
        let name="Soe Min Oo"
        console.log(name);
        console.log(typeof(name))

        // numberic data type 
        let age=24;
        console.log(age);
        console.log(typeof(age))

        // boolean data type 
        let isstudent=(true)
        console.log(isstudent);
        console.log(typeof(isstudent));

        // undefined data type 
        let undefinedvar=undefined;
        console.log(undefined);
        console.log(typeof(undefined));

        // null data type
        let nullvar=null;
        console.log(null);
        console.log(typeof(null))

        // Array data type 
        let stuent_list= new Array("Mg Mg" , "Aung Aung" , "Soe Min Oo");

        console.log(stuent_list);
        console.log(typeof(stuent_list));
        console.log(stuent_list.length);
        console.log(stuent_list[2]);

        // Object data type 
        let stuent = {
            name : "Soe Min Oo" ,
            age : 21 ,
            address : "Yangon" ,
        }

        console.log(stuent)
        console.log(typeof(stuent))
        console.log(stuent.name)

        

    </script>
</body>
</html>
