<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loop</title>
</head>
<body>
    <h1>Looping</h1>

    <script>
        // for loop ()
        for(let i=0;i<50;i++){
            document.write("<h1>Hello world "+(i+1) +"</h1>")
            
        }

        let laptop_list=["Dell","Mac Book pro","Mac Book Air", "Mac Neo"];

        for(let i=0; i<laptop_list.length; i++){

            document.write("<h1>Hello world "+(laptop_list[i]) +"</h1>")

        }
    </script>
</body>
</html>
