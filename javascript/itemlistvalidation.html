<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item List Validation</title>
</head>

<body>
    <h1>Item List</h1>
    <form action="" name="myform" onsubmit="return formvalidation()">

        <label for="itemname">Item Name</label><br>
        <input type="text" name="iName" id="itemname">
        <small id="name_error"></small><br><br>

        <label for="itemprice">item Price</label><br>
        <input type="number" name="iPrice" id="itemprice">
        <small id="price_error"></small><br><br>

        <label for="qty">Qty</label><br>
        <input type="number" name="iQty" id="qty">
        <small id="qty_error"></small><br><br>

        <button type="submit" >Add Table </button><br><br>
    </form>

    <h1>Table </h1>
    <table cellspecing="0" cellpadding="30" border="1">
        <thead>
            <tr>
                <th>No</th>
                <th>Item Name</th>
                <th>Item Price</th>
                <th>Qty</th>
                <th>Total</th>
                
            </tr>
            </tr>
        </thead>

        <tbody id="mybody">
            
        </tbody>

    </table>

    <script>

        let itemlist = [];
        

        //get input data
        function formvalidation() {
            let name = document.myform.iName.value;
            let price = document.myform.iPrice.value;
            let qty = document.myform.iQty.value;
            
            

            // console.log(name)
            // console.log(price)
            // console.log(qty)

            if(name == ''){
                document.getElementById('itemname').style.border = '1px solid red';
                document.getElementById('name_error').innerText= 'Name is requried';
                document.getElementById('name_error').style.color= 'red';

                return false;

            }
            else{
                document.getElementById('name_error').style.color='none';
                document.getElementById('name_error').innerText = '';
            }
            
            if(price == ''){
                document.getElementById('itemprice').style.border = '1px solid red';
                document.getElementById('price_error').innerText= 'price is requried';
                document.getElementById('price_error').style.color= 'red';

                return false;

            }
            else{
                document.getElementById('price_error').style.color='none';
                document.getElementById('price_error').innerText = '';
            }

            if(qty == ''){
                document.getElementById('qty').style.border = '1px solid red';
                document.getElementById('qty_error').innerText= 'Qty is requried';
                document.getElementById('qty_error').style.color= 'red';

                return false;

            }
            else{
                document.getElementById('qty_error').style.color='none';
                document.getElementById('qty_error').innerText = '';
            }


            // create object 
            let item = {

                item_name: name,
                item_price: price,
                item_qty: qty

            }
            // console.log(item)

            //push array
            itemlist.push(item);

            // console.log(itemlist)

            let html = ''
            let grand_total= 0
            for( i=0; i<itemlist.length ;i++ ){
                let Total = itemlist[i].item_price * itemlist[i].item_qty;
                grand_total += Total ;

                html += 
                    `<tr> 
                        <td>${i+1}</td>
                        <td>${itemlist[i].item_name}</td>
                        <td>${itemlist[i].item_price}</td>
                        <td>${itemlist[i].item_qty}</td>
                        <td>${Total}</td>

                        </tr>`
                        
                        
                
            }
            html += `<tr>
                <td colspan="4">Grand Total</td>
                <td>${grand_total}</td>
             </tr>`;


            document.getElementById("mybody").innerHTML= html ;

            return false;

        }




    </script>
</body>

</html>
