<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conpresion</title>
</head>

<body>
    <h1>Conparsion</h1>

    <script>

        // greater than 
        let num = '10';
        let num1 = 10;
        
        console.log(num > num1)
        // true false 

        // greater than equal
        console.log(num >= num1)

        // less than 
        console.log(num < num1)

        // less than equal 
        console.log(num <= num1)

        // double equal == value
        console.log(num == num1)

        // triple equal === value and data type
        console.log(num === num1)

        // not equal != value
        console.log(num != num1)

        //not double equal !== value and data type
        console.log(num !== num1)




    </script>
</body>

</html>
