<body>
    <h1>Operator</h1>

    <script>
        // adding operator 
        let number = 1;
        // number = number+1;
        // number += 1 ;
        // number++
        // console.log(number)
        console.log(++number)

        // multioperator 
        let nun = 4*5;
        // nun *= 5 ;
        console.log(nun);

        // division operator 
        let nun1 = 10/2;
        console.log(nun1)
        
        // remainder operator 
        let nun2 = 10;
        num2 = nun2%2;
        console.log(nun2)

        // exponent operator 
        let nun3 = 50;
        let nun4 = 60;
        let nun5 = nun3 + nun4;
        console.log(nun5)

        // presendence operator 
        let num = (5+5)-10*2/2%2;
        console.log(num)


        
    </script>
