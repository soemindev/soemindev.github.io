<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <H1>Condition</H1>

    <script>
        let num=prompt("enter a number")

        if(num>10){
            document.write("num is greater than 10")
        }
        else if(num==10){
            document.write("num is equal 10")
        }
        else{
            document.write("num is less than 10")
        }
    </script>
</body>
</html>
